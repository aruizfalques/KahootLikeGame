<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClassQuiz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236d4aff'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>?</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1e1645; --bg2:#2a1f5e; --card:#ffffff; --ink:#1b1534; --muted:#6b6590; --line:#e6e2f5;
  --brand:#6d4aff; --brand-ink:#ffffff; --good:#22a861; --bad:#e5484d;
  --a:#e5484d; --b:#3e63dd; --c:#e8a10c; --d:#22a861;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Lexend,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#fff;
  background-image:radial-gradient(circle at 15% 10%,#3a2b86 0,transparent 40%),radial-gradient(circle at 90% 90%,#3b1f6b 0,transparent 45%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 20px;font-weight:600;background:var(--brand);color:var(--brand-ink);
  box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s,filter .15s}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
button.light{background:#fff;color:var(--ink)}
button.danger{background:var(--bad)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 80px}
.card{background:var(--card);color:var(--ink);border-radius:var(--radius);padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.logo{font-weight:800;font-size:28px;letter-spacing:-.5px}
.logo span{color:#b9a8ff}
h1,h2,h3{margin:0 0 12px;line-height:1.15}
.center{text-align:center}
.hidden{display:none!important}
.err{background:#ffe5e5;color:#9b1c1c;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px}

/* shapes */
.shape{width:1em;height:1em;display:inline-block;flex:none}
.opt-0{background:var(--a)} .opt-1{background:var(--b)} .opt-2{background:var(--c)} .opt-3{background:var(--d)}

/* ---------- library / editor ---------- */
.quiz-item{display:flex;gap:12px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:14px;margin-top:10px}
.quiz-item h3{margin:0;font-size:18px}
.q-edit{border:2px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.q-edit .num{font-weight:800;color:var(--brand)}
.opt-edit{display:flex;gap:8px;align-items:center;margin-top:8px}
.opt-edit .sw{width:38px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.opt-edit label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer}
.opt-edit input[type=radio]{width:20px;height:20px;accent-color:var(--good)}
.opt-edit.correct input[type=text]{border-color:var(--good);background:#effaf3}
textarea.bulk{min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.tip{font-size:13px;background:#f4f1ff;color:#4b3aa8;border-radius:10px;padding:10px 12px}

/* ---------- host game ---------- */
.stage{min-height:100vh;display:flex;flex-direction:column;padding:20px clamp(16px,3vw,40px)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:8px 16px;font-weight:600}
.lobby{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:24px;margin-top:20px;flex:1}
@media (max-width:800px){.lobby{grid-template-columns:1fr}}
.joinbox{background:#fff;color:var(--ink);border-radius:20px;padding:24px;text-align:center;align-self:start}
.joinbox .url{font-weight:800;font-size:clamp(18px,2.4vw,26px);word-break:break-all}
.joinbox .pin{font-size:clamp(48px,7vw,84px);font-weight:800;letter-spacing:4px;line-height:1;margin:6px 0 10px}
#qr{display:flex;justify-content:center;margin:14px 0 4px} #qr img,#qr canvas{width:180px;height:180px}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.chip{background:#fff;color:var(--ink);font-weight:600;border-radius:12px;padding:10px 16px;font-size:clamp(15px,1.6vw,20px);animation:pop .3s ease-out;border:0;box-shadow:none}
.chip:hover{background:#ffe5e5;text-decoration:line-through}
.chip.off{opacity:.45}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.qtext{background:#fff;color:var(--ink);border-radius:18px;padding:clamp(16px,2.5vw,28px);font-size:clamp(22px,3.4vw,44px);font-weight:800;text-align:center;line-height:1.2;margin-top:16px}
.mid{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0;flex:1;min-height:120px}
.timer{width:clamp(90px,11vw,140px);height:clamp(90px,11vw,140px);border-radius:50%;background:var(--brand);display:grid;place-items:center;font-size:clamp(34px,4.5vw,56px);font-weight:800;box-shadow:0 0 0 8px rgba(109,74,255,.3)}
.timer.low{background:var(--bad);box-shadow:0 0 0 8px rgba(229,72,77,.3);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.counter{text-align:center;font-weight:800;font-size:clamp(34px,4.5vw,56px);line-height:1}
.counter small{display:block;font-size:16px;font-weight:600;opacity:.8}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;align-items:center;gap:16px;border-radius:14px;padding:clamp(14px,2vw,24px);font-size:clamp(18px,2.4vw,30px);font-weight:600;color:#fff;min-height:clamp(70px,10vh,120px);transition:opacity .3s,transform .3s}
.tile .shape{font-size:clamp(26px,3vw,40px);background:none}
.tile.dim{opacity:.28}
.tile.win{outline:5px solid #fff;transform:scale(1.02)}
.tile .check{margin-left:auto;font-size:1.3em}
.bars{display:flex;gap:clamp(10px,3vw,40px);align-items:flex-end;justify-content:center;height:clamp(140px,28vh,280px);margin:20px 0}
.bar{width:clamp(56px,9vw,120px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .fill{width:100%;border-radius:10px 10px 0 0;min-height:8px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.bar .n{font-weight:800;font-size:clamp(20px,2.4vw,32px);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.bar .shape{font-size:22px;margin-top:8px;background:none}
.progress{height:10px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:24px}
.progress div{height:100%;background:#fff;border-radius:99px}
.board{max-width:760px;width:100%;margin:20px auto 0;display:flex;flex-direction:column;gap:10px}
.brow{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:14px;padding:14px 18px;font-size:clamp(18px,2.2vw,26px);font-weight:600;animation:slide .4s ease-out backwards}
.brow .r{width:2em;font-weight:800;color:var(--brand)}
.brow .s{margin-left:auto;font-weight:800}
.brow .chg{font-size:.7em;color:var(--good)}
.brow .fire{font-size:.75em}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2vw,24px);margin-top:30px}
.pod{display:flex;flex-direction:column;align-items:center;width:clamp(100px,18vw,220px);animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards}
.pod .nm{font-weight:800;font-size:clamp(16px,2.2vw,28px);text-align:center;word-break:break-word;margin-bottom:8px}
.pod .blk{width:100%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12px;font-weight:800;font-size:clamp(28px,4vw,52px);color:var(--ink)}
.pod .blk small{font-size:clamp(13px,1.4vw,18px);font-weight:600}
.pod.p1 .blk{height:clamp(150px,26vh,260px);background:#ffd54a} .pod.p1{animation-delay:1.6s}
.pod.p2 .blk{height:clamp(110px,19vh,190px);background:#dfe3ee} .pod.p2{animation-delay:.9s}
.pod.p3 .blk{height:clamp(80px,14vh,140px);background:#e9b48a} .pod.p3{animation-delay:.2s}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
.controls{display:flex;gap:10px;justify-content:flex-end;margin-top:auto;padding-top:20px}
.controls .next{font-size:20px;padding:14px 28px}

/* ---------- player ---------- */
.phone{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.phone .bar-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(0,0,0,.2);font-weight:600}
.phone .body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;gap:14px}
.phone .big{font-size:clamp(26px,7vw,40px);font-weight:800;line-height:1.15}
.ptiles{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;padding:10px;width:100%}
.ptiles.two{grid-template-columns:1fr}
.ptile{border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:clamp(15px,4vw,22px);font-weight:600;padding:12px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25);min-height:110px}
.ptile .shape{font-size:clamp(34px,10vw,56px);background:none}
.result{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.result.ok{background:var(--good)} .result.no{background:var(--bad)}
.badge{background:rgba(0,0,0,.25);border-radius:999px;padding:10px 20px;font-weight:800;font-size:22px}
.spinner{width:44px;height:44px;border:5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.join{max-width:380px;width:100%;margin:0 auto}
.join input{text-align:center;font-size:22px;font-weight:600;padding:16px}
.join button{width:100%;font-size:20px;padding:16px;margin-top:10px;background:var(--ink)}
.mini-pod{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;width:100%;max-width:340px;text-align:left}
.mini-pod div{display:flex;justify-content:space-between;padding:4px 0;font-weight:600}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
// ================= shared helpers =================
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SHAPES = [
  '<svg class="shape" viewBox="0 0 24 24"><path d="M12 3 22 20H2z" fill="currentColor"/></svg>',
  '<svg class="shape" viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z" fill="currentColor"/></svg>',
  '<svg class="shape" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>',
  '<svg class="shape" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="currentColor"/></svg>',
];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({ error: 'Server error' }));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
const ord = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
let tick = null;
function countdown(el, endsAt, onTick) {
  clearInterval(tick);
  const f = () => { const s = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)); if (el) el.textContent = s; onTick && onTick(s); if (s <= 0) clearInterval(tick); };
  f(); tick = setInterval(f, 200);
}
// live connection with auto-retry; calls onState(state) for each update
function connect(url, onState, onDead) {
  let es, closed = false, fails = 0;
  const open = () => {
    es = new EventSource(url);
    es.onmessage = e => { fails = 0; onState(JSON.parse(e.data)); };
    es.onerror = async () => {
      if (closed || es.readyState !== EventSource.CLOSED) return;
      // stream refused (e.g. game gone) — check, then retry a few times
      fails++;
      if (fails > 5) return onDead('Lost connection to the game.');
      setTimeout(open, 1500);
    };
  };
  open();
  return { close() { closed = true; es && es.close(); } };
}

</script>
<script>
'use strict';
// =================================================================
// ======================  HOST (teacher)  =========================
// =================================================================
var Host = (() => {
  const SAMPLE = {
    id: 'sample', title: 'Sample: Science & General Knowledge',
    questions: [
      { text: 'Which planet is known as the Red Planet?', options: ['Venus', 'Mars', 'Jupiter', 'Mercury'], correct: 1, time: 20 },
      { text: 'Water boils at 100 °C at sea level.', options: ['True', 'False'], correct: 0, time: 10 },
      { text: 'What is the largest organ of the human body?', options: ['Liver', 'Brain', 'Skin', 'Heart'], correct: 2, time: 20 },
      { text: 'How many sides does a hexagon have?', options: ['5', '6', '7', '8'], correct: 1, time: 15 },
      { text: 'Which gas do plants absorb from the air?', options: ['Oxygen', 'Nitrogen', 'Helium', 'Carbon dioxide'], correct: 3, time: 20 },
    ],
  };
  let quizzes = store.get('cq.quizzes', null);
  if (!quizzes) { quizzes = [structuredClone(SAMPLE)]; save(); }
  function save() { store.set('cq.quizzes', quizzes); }
  const newId = () => Math.random().toString(36).slice(2, 10);
  let editing = null, conn = null, session = null, state = null, lan = [];

  function init() {
    api('/api/info').then(i => { lan = i.lan || []; }).catch(() => {});
    const s = (() => { try { return JSON.parse(sessionStorage.getItem('cq.host')); } catch { return null; } })();
    if (s) startStream(s); else library();
    document.addEventListener('keydown', e => {
      if (!state || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
      if ((e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') && state.phase !== 'final') { e.preventDefault(); act('next'); }
    });
  }

  // ---------- library ----------
  function library() {
    state = null;
    $app.innerHTML = `
      <div class="wrap">
        <div class="row" style="margin-bottom:20px"><div class="logo grow">Class<span>Quiz</span></div>
          <button class="ghost small" id="imp">Import</button><button id="new">+ New quiz</button></div>
        <div class="card">
          <h2>Your quizzes</h2>
          <p class="muted" style="margin:0">Quizzes are saved in this browser. Pick one and press <b>Host live</b> — students join on their phones.</p>
          <div id="list"></div>
        </div>
        <input type="file" id="file" accept=".json,application/json" class="hidden">
      </div>`;
    const list = document.getElementById('list');
    if (!quizzes.length) list.innerHTML = '<p class="muted" style="margin-top:16px">No quizzes yet — create one!</p>';
    quizzes.forEach((q, i) => {
      const el = document.createElement('div'); el.className = 'quiz-item';
      el.innerHTML = `<div class="grow"><h3>${esc(q.title)}</h3><div class="muted" style="font-size:14px">${q.questions.length} question${q.questions.length === 1 ? '' : 's'}</div></div>
        <button class="small light" data-a="edit" style="border:2px solid var(--line)">Edit</button>
        <button class="small light" data-a="dup" style="border:2px solid var(--line)" title="Duplicate">Copy</button>
        <button class="small light" data-a="exp" style="border:2px solid var(--line)" title="Download as file">Export</button>
        <button class="small light" data-a="del" style="border:2px solid var(--line);color:var(--bad)">Delete</button>
        <button class="small" data-a="play" style="background:var(--good)">▶ Host live</button>`;
      el.onclick = e => {
        const a = e.target.dataset.a; if (!a) return;
        if (a === 'edit') editor(i);
        if (a === 'dup') { quizzes.splice(i + 1, 0, { ...structuredClone(q), id: newId(), title: q.title + ' (copy)' }); save(); library(); }
        if (a === 'del' && confirm(`Delete "${q.title}"?`)) { quizzes.splice(i, 1); save(); library(); }
        if (a === 'exp') download(q.title.replace(/[^\w\- ]+/g, '') + '.json', JSON.stringify({ title: q.title, questions: q.questions }, null, 2), 'application/json');
        if (a === 'play') launch(q, e.target);
      };
      list.appendChild(el);
    });
    document.getElementById('new').onclick = () => { quizzes.unshift({ id: newId(), title: 'New quiz', questions: [blankQ()] }); save(); editor(0); };
    const file = document.getElementById('file');
    document.getElementById('imp').onclick = () => file.click();
    file.onchange = async () => {
      try {
        const data = JSON.parse(await file.files[0].text());
        if (!Array.isArray(data.questions)) throw 0;
        quizzes.unshift({ id: newId(), title: data.title || 'Imported quiz', questions: data.questions }); save(); library(); toast('Quiz imported');
      } catch { toast('That file is not a ClassQuiz quiz.'); }
    };
  }
  const blankQ = () => ({ text: '', options: ['', '', '', ''], correct: 0, time: 20 });

  // ---------- editor ----------
  function editor(i) {
    editing = i;
    const q = quizzes[i];
    $app.innerHTML = `
      <div class="wrap">
        <div class="row" style="margin-bottom:20px"><button class="ghost small" id="back">← Back</button><div class="grow"></div>
          <button class="small" id="play" style="background:var(--good)">▶ Host live</button></div>
        <div class="card">
          <label class="muted" style="font-size:14px">Quiz title</label>
          <input id="title" value="${esc(q.title)}" style="font-size:22px;font-weight:600;margin-top:4px">
          <div id="qs"></div>
          <div class="row" style="margin-top:16px">
            <button id="addq">+ Question</button>
            <button id="addtf" class="light" style="border:2px solid var(--line)">+ True / False</button>
            <button id="bulkbtn" class="light" style="border:2px solid var(--line)">Paste many at once</button>
          </div>
          <div id="bulk" class="hidden" style="margin-top:14px">
            <div class="tip">One question per block, separated by a blank line. Start answers with <b>-</b> and mark the correct one with <b>*</b>. Optional time: <b>[30s]</b> at the end of the question.<br>
            <code>Capital of France? [15s]<br>- Madrid<br>* Paris<br>- Rome</code></div>
            <textarea class="bulk" id="bulktxt" style="margin-top:10px" placeholder="What is 7 × 8?&#10;- 54&#10;* 56&#10;- 64&#10;&#10;The Sun is a star.&#10;* True&#10;- False"></textarea>
            <div class="row" style="margin-top:10px"><button id="bulkadd">Add these questions</button><span id="bulkerr" class="muted"></span></div>
          </div>
        </div>
      </div>`;
    const qs = document.getElementById('qs');
    const render = () => {
      qs.innerHTML = '';
      q.questions.forEach((x, n) => {
        const el = document.createElement('div'); el.className = 'q-edit';
        const opts = x.options.length === 2 ? 2 : 4;
        el.innerHTML = `
          <div class="row"><span class="num">Q${n + 1}</span><div class="grow"></div>
            <select data-f="time" style="width:auto">${[5,10,15,20,30,45,60,90,120].map(t => `<option value="${t}" ${t === +x.time ? 'selected' : ''}>${t} s</option>`).join('')}</select>
            <button class="small ghost" data-a="up" style="color:var(--muted)" title="Move up">↑</button>
            <button class="small ghost" data-a="down" style="color:var(--muted)" title="Move down">↓</button>
            <button class="small ghost" data-a="del" style="color:var(--bad)" title="Delete">✕</button></div>
          <textarea data-f="text" rows="2" placeholder="Type your question…" style="margin-top:10px;font-weight:600">${esc(x.text)}</textarea>
          ${Array.from({ length: opts }, (_, k) => `
            <div class="opt-edit ${x.correct === k ? 'correct' : ''}">
              <div class="sw opt-${k}">${SHAPES[k]}</div>
              <input type="text" data-o="${k}" value="${esc(x.options[k] || '')}" placeholder="Answer ${k + 1}${k > 1 ? ' (optional)' : ''}">
              <label><input type="radio" name="c${n}" data-c="${k}" ${x.correct === k ? 'checked' : ''}>correct</label>
            </div>`).join('')}`;
        el.oninput = e => {
          const t = e.target;
          if (t.dataset.f === 'text') x.text = t.value;
          if (t.dataset.f === 'time') x.time = +t.value;
          if (t.dataset.o) x.options[+t.dataset.o] = t.value;
          save();
        };
        el.onchange = e => {
          if (e.target.dataset.c != null) { x.correct = +e.target.dataset.c; save(); render(); }
          if (e.target.dataset.f === 'time') { x.time = +e.target.value; save(); }
        };
        el.onclick = e => {
          const a = e.target.dataset.a; if (!a) return;
          if (a === 'del') { if (q.questions.length > 1 || confirm('Delete the last question?')) q.questions.splice(n, 1); }
          if (a === 'up' && n > 0) [q.questions[n - 1], q.questions[n]] = [q.questions[n], q.questions[n - 1]];
          if (a === 'down' && n < q.questions.length - 1) [q.questions[n + 1], q.questions[n]] = [q.questions[n], q.questions[n + 1]];
          save(); render();
        };
        qs.appendChild(el);
      });
    };
    render();
    document.getElementById('title').oninput = e => { q.title = e.target.value; save(); };
    document.getElementById('back').onclick = library;
    document.getElementById('play').onclick = e => launch(q, e.target);
    document.getElementById('addq').onclick = () => { q.questions.push(blankQ()); save(); render(); qs.lastChild.querySelector('textarea').focus(); };
    document.getElementById('addtf').onclick = () => { q.questions.push({ text: '', options: ['True', 'False'], correct: 0, time: 10 }); save(); render(); qs.lastChild.querySelector('textarea').focus(); };
    document.getElementById('bulkbtn').onclick = () => document.getElementById('bulk').classList.toggle('hidden');
    document.getElementById('bulkadd').onclick = () => {
      const { items, errors } = parseBulk(document.getElementById('bulktxt').value);
      document.getElementById('bulkerr').textContent = errors.join(' ');
      if (!items.length) return;
      // replace an untouched blank first question
      if (q.questions.length === 1 && !q.questions[0].text.trim()) q.questions = [];
      q.questions.push(...items); save(); render();
      document.getElementById('bulktxt').value = '';
      toast(`Added ${items.length} question${items.length === 1 ? '' : 's'}`);
    };
  }

  function parseBulk(txt) {
    const items = [], errors = [];
    txt.replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).forEach((block, i) => {
      const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
      let text = [], options = [], correct = -1;
      for (const l of lines) {
        const m = l.match(/^([-*+✓])\s*(.+)$/);
        if (m) { if (m[1] !== '-') correct = options.length; options.push(m[2]); }
        else if (!options.length) text.push(l);
      }
      let t = text.join(' '), time = 20;
      const tm = t.match(/\[(\d+)\s*s?\]\s*$/i);
      if (tm) { time = +tm[1]; t = t.replace(tm[0], '').trim(); }
      if (!t || options.length < 2 || correct < 0) { errors.push(`Block ${i + 1} skipped (needs a question, 2–4 answers and one marked with *).`); return; }
      options = options.slice(0, 4);
      items.push({ text: t, options: options.length === 3 ? [...options, ''] : options, correct: Math.min(correct, 3), time });
    });
    return { items, errors };
  }

  function problems(q) {
    for (const [n, x] of q.questions.entries()) {
      if (!x.text.trim()) return `Question ${n + 1} has no text.`;
      if (x.options.filter(o => o.trim()).length < 2) return `Question ${n + 1} needs at least 2 answers.`;
      if (!x.options[x.correct]?.trim()) return `Question ${n + 1}: the answer marked correct is empty.`;
    }
    return null;
  }

  async function launch(q, btn) {
    const p = problems(q);
    if (p) { toast(p); return; }
    // drop empty answer slots, keeping the correct index aligned
    const questions = q.questions.map(x => {
      const kept = x.options.map((o, k) => ({ o: o.trim(), k })).filter(v => v.o);
      return { text: x.text, time: x.time, options: kept.map(v => v.o), correct: kept.findIndex(v => v.k === x.correct) };
    });
    btn.disabled = true;
    try {
      const { pin, hostKey } = await api('/api/games', { quiz: { title: q.title, questions } });
      const s = { pin, hostKey };
      sessionStorage.setItem('cq.host', JSON.stringify(s));
      startStream(s);
    } catch (e) { toast(e.message); btn.disabled = false; }
  }

  // ---------- live game ----------
  function startStream(s) {
    session = s;
    conn && conn.close();
    conn = connect(`/api/stream?pin=${s.pin}&hostKey=${s.hostKey}`, st => { state = st; renderGame(); },
      msg => { sessionStorage.removeItem('cq.host'); toast(msg); library(); });
  }
  const act = (action, extra) => api('/api/host?pin=' + session.pin, { hostKey: session.hostKey, action, ...extra }).catch(e => toast(e.message));
  function endGame() {
    if (state.phase !== 'final' && !confirm('End this game for everyone?')) return;
    act('end'); conn && conn.close(); sessionStorage.removeItem('cq.host'); state = null; library();
  }

  function joinUrl() {
    let origin = location.origin;
    if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && lan.length) origin = `${location.protocol}//${lan[0]}${location.port ? ':' + location.port : ''}`;
    return origin;
  }

  let lastKey = '';
  function renderGame() {
    const s = state;
    // avoid re-rendering animated screens when only counts change
    const key = s.phase + ':' + s.qIndex;
    const fresh = key !== lastKey; lastKey = key;
    const top = `<div class="topbar"><div class="logo" style="font-size:22px">Class<span>Quiz</span></div>
      <div class="row">${s.qIndex >= 0 ? `<span class="pill">Question ${s.qIndex + 1} / ${s.total}</span>` : ''}
      <span class="pill">PIN ${s.pin}</span><span class="pill" id="pc">👥 ${s.players.length}</span></div></div>`;
    const ctrl = (label, opts = {}) => `<div class="controls"><button class="ghost small" id="end">${s.phase === 'final' ? 'Close game' : 'End game'}</button>
      ${label ? `<button class="next" id="next" ${opts.disabled ? 'disabled' : ''}>${label}</button>` : ''}</div>`;

    if (s.phase === 'lobby') {
      const url = joinUrl();
      const shortUrl = url.replace(/^https?:\/\//, '');
      if (fresh) {
        $app.innerHTML = `<div class="stage">${top}
          <div class="lobby">
            <div class="joinbox">
              <div class="muted">Go to</div><div class="url">${esc(shortUrl)}</div>
              <div class="muted" style="margin-top:12px">and enter the game PIN</div>
              <div class="pin">${s.pin}</div>
              <div id="qr"></div><div class="muted hidden" id="qrl" style="font-size:13px">or scan to join</div>
            </div>
            <div><h2 id="cnt"></h2><p class="muted" style="color:#c9c1ee;margin-top:-6px">Click a name to remove a player.</p><div class="chips" id="chips"></div></div>
          </div>${ctrl('Start ▶')}</div>`;
        const qrEl = document.getElementById('qr');
        const drawQr = () => { if (window.QRCode) { qrEl.innerHTML = ''; new QRCode(qrEl, { text: `${url}/?pin=${s.pin}`, width: 360, height: 360 }); document.getElementById('qrl')?.classList.remove('hidden'); } };
        window.QRCode ? drawQr() : window.addEventListener('load', drawQr, { once: true });
        bindCtrl();
      }
      document.getElementById('pc').textContent = '👥 ' + s.players.length;
      document.getElementById('cnt').textContent = s.players.length ? `${s.players.length} player${s.players.length === 1 ? '' : 's'} joined` : 'Waiting for players…';
      const chips = document.getElementById('chips');
      const have = new Set([...chips.children].map(c => c.dataset.id));
      const ids = new Set(s.players.map(p => p.id));
      [...chips.children].forEach(c => { if (!ids.has(c.dataset.id)) c.remove(); });
      for (const p of [...s.players].reverse()) {
        if (have.has(p.id)) { chips.querySelector(`[data-id="${p.id}"]`).classList.toggle('off', !p.connected); continue; }
        const b = document.createElement('button'); b.className = 'chip' + (p.connected ? '' : ' off'); b.dataset.id = p.id; b.textContent = p.name; b.title = 'Remove player';
        b.onclick = () => confirm(`Remove ${p.name}?`) && act('kick', { playerId: p.id });
        chips.prepend(b);
      }
      document.getElementById('next').disabled = !s.players.length;
      return;
    }

    const q = s.question;
    if (s.phase === 'ready') {
      if (!fresh) return;
      const endsAt = Date.now() + s.remainingMs;
      $app.innerHTML = `<div class="stage">${top}
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
          <div class="center" style="font-size:22px;font-weight:600;opacity:.85">Question ${s.qIndex + 1} of ${s.total}</div>
          <div class="qtext">${esc(q.text)}</div>
          <div class="progress"><div id="pb" style="width:100%"></div></div>
        </div>${ctrl('Skip ▶')}</div>`;
      const pb = document.getElementById('pb'); const total = s.remainingMs;
      clearInterval(tick); tick = setInterval(() => { pb.style.width = Math.max(0, (endsAt - Date.now()) / total * 100) + '%'; }, 50);
      bindCtrl(); return;
    }

    if (s.phase === 'question') {
      if (fresh) {
        $app.innerHTML = `<div class="stage">${top}
          <div class="qtext">${esc(q.text)}</div>
          <div class="mid"><div class="timer" id="tm"></div><div></div><div class="counter"><span id="ans">0</span><small>answers</small></div></div>
          <div class="tiles">${q.options.map((o, k) => `<div class="tile opt-${k}">${SHAPES[k]}<span>${esc(o)}</span></div>`).join('')}</div>
          ${ctrl('Skip ▶')}</div>`;
        const tm = document.getElementById('tm');
        countdown(tm, Date.now() + s.remainingMs, sec => tm.classList.toggle('low', sec <= 5 && sec > 0));
        bindCtrl();
      }
      document.getElementById('ans').textContent = s.answered;
      return;
    }

    if (s.phase === 'reveal') {
      if (!fresh) return;
      clearInterval(tick);
      const max = Math.max(1, ...s.counts);
      $app.innerHTML = `<div class="stage">${top}
        <div class="qtext">${esc(q.text)}</div>
        <div class="bars">${s.counts.map((c, k) => `<div class="bar"><div class="n">${c}${k === q.correct ? ' ✓' : ''}</div>
          <div class="fill opt-${k}" style="height:0" data-h="${c / max * 100}"></div><div class="shape" style="color:var(--${'abcd'[k]})">${SHAPES[k]}</div></div>`).join('')}</div>
        <div class="tiles">${q.options.map((o, k) => `<div class="tile opt-${k} ${k === q.correct ? 'win' : 'dim'}">${SHAPES[k]}<span>${esc(o)}</span>${k === q.correct ? '<span class="check">✓</span>' : ''}</div>`).join('')}</div>
        ${ctrl(s.qIndex + 1 >= s.total ? 'Final results 🏆' : 'Next ▶')}</div>`;
      requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.fill').forEach(f => f.style.height = `calc(${f.dataset.h}% - 70px)`)));
      bindCtrl(); return;
    }

    if (s.phase === 'leaderboard') {
      if (!fresh) return;
      const top5 = s.players.slice(0, 5);
      $app.innerHTML = `<div class="stage">${top}
        <h1 class="center" style="font-size:clamp(28px,4vw,48px);margin-top:20px">Leaderboard</h1>
        <div class="board">${top5.map((p, i) => {
          const up = s.qIndex > 0 && p.prevRank && p.prevRank > p.rank ? `<span class="chg">▲ ${p.prevRank - p.rank}</span>` : '';
          return `<div class="brow" style="animation-delay:${i * .08}s"><span class="r">${p.rank}</span><span>${esc(p.name)}</span>${up}${p.streak >= 3 ? `<span class="fire">🔥${p.streak}</span>` : ''}<span class="s">${p.score}</span></div>`;
        }).join('') || '<p class="center">No players</p>'}</div>
        ${ctrl('Next question ▶')}</div>`;
      bindCtrl(); return;
    }

    if (s.phase === 'final') {
      if (!fresh) return;
      const [a, b, c] = s.players;
      const pod = (p, n) => p ? `<div class="pod p${n}"><div class="nm">${esc(p.name)}</div><div class="blk">${n}<small>${p.score} pts</small></div></div>` : `<div class="pod p${n}" style="visibility:hidden"><div class="blk"></div></div>`;
      $app.innerHTML = `<div class="stage">${top}
        <h1 class="center" style="font-size:clamp(28px,4vw,48px);margin-top:16px">🏆 ${esc(s.title)}</h1>
        <div class="podium">${pod(b, 2)}${pod(a, 1)}${pod(c, 3)}</div>
        <div class="controls"><button class="ghost small" id="csv">Download results (CSV)</button><div class="grow"></div><button class="ghost small" id="end">Close game</button><button class="next" id="again">Back to my quizzes</button></div></div>`;
      document.getElementById('csv').onclick = () => {
        const rows = [['Rank', 'Name', 'Score', `Correct (of ${s.total})`], ...s.players.map(p => [p.rank, p.name, p.score, p.correctCount])];
        download(`${s.title} results.csv`, rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
      };
      document.getElementById('end').onclick = endGame;
      document.getElementById('again').onclick = endGame;
      return;
    }
  }
  function bindCtrl() {
    const n = document.getElementById('next'); if (n) n.onclick = () => { n.disabled = true; act('next'); };
    document.getElementById('end').onclick = endGame;
  }
  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + text], { type })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  return { init };
})();
</script>
<script>
'use strict';
// =================================================================
// =====================  PLAYER (student)  ========================
// =================================================================
var Player = (() => {
  let conn = null, me = store.get('cq.player', null), lastKey = '', sending = false;

  function init() {
    const pin = new URLSearchParams(location.search).get('pin');
    if (me && (!pin || pin === me.pin)) return startStream();
    joinForm(pin || '');
  }

  function joinForm(pin, err) {
    conn && conn.close(); lastKey = '';
    $app.innerHTML = `<div class="phone"><div class="body">
      <div class="logo" style="font-size:40px;margin-bottom:10px">Class<span>Quiz</span></div>
      <form class="join card" id="f" style="padding:18px">
        <input id="pin" inputmode="numeric" autocomplete="off" placeholder="Game PIN" value="${esc(pin)}" maxlength="6">
        <input id="name" autocomplete="off" placeholder="Nickname" maxlength="20" style="margin-top:10px">
        <button>Join</button>
        ${err ? `<div class="err">${esc(err)}</div>` : ''}
      </form></div></div>`;
    document.getElementById(pin ? 'name' : 'pin').focus();
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      const b = e.target.querySelector('button'); b.disabled = true;
      const p = document.getElementById('pin').value.trim(), n = document.getElementById('name').value.trim();
      try {
        const r = await api('/api/join', { pin: p, name: n });
        me = { pin: r.pin, id: r.playerId }; store.set('cq.player', me);
        history.replaceState(null, '', '/');
        startStream();
      } catch (er) { joinForm(p, er.message); setTimeout(() => { const ni = document.getElementById('name'); ni.value = n; ni.focus(); }); }
    };
  }

  function leave(msg) { store.del('cq.player'); me = null; joinForm('', msg); }

  function startStream() {
    conn = connect(`/api/stream?pin=${me.pin}&playerId=${me.id}`, render, () => leave('The game has ended or is no longer available.'));
  }

  const shell = (s, inner, bg) => `<div class="phone" ${bg ? `style="background:${bg}"` : ''}>
    <div class="bar-top"><span>${esc(s.me?.name || '')}</span><span>${s.qIndex >= 0 && s.total ? `${s.qIndex + 1}/${s.total}` : ''}</span><span>${s.me ? s.me.score + ' pts' : ''}</span></div>
    ${inner}</div>`;
  const standing = s => s.me.rank === 1 ? `You're in <b>1st place!</b> 🥇` :
    `You're in <b>${ord(s.me.rank)}</b> place${s.ahead ? `<br><span style="opacity:.8">${s.ahead.gap} pts behind ${esc(s.ahead.name)}</span>` : ''}`;

  function render(s) {
    if (s.phase === 'kicked') { conn.close(); return leave('You were removed from the game.'); }
    if (s.phase === 'ended') { conn.close(); return leave('The teacher ended the game. Thanks for playing!'); }
    const key = [s.phase, s.qIndex, !!s.myAnswer, s.me.score, s.me.rank].join(':');
    if (key === lastKey) return; lastKey = key;

    if (s.phase === 'lobby') {
      $app.innerHTML = shell(s, `<div class="body"><div class="big">You're in! 🎉</div><div style="font-size:20px">See your name on the screen?</div><div class="spinner" style="margin-top:20px"></div><div class="muted" style="color:#c9c1ee">Waiting for the teacher to start…</div>
        <button class="ghost small" id="lv" style="margin-top:30px">Leave</button></div>`);
      document.getElementById('lv').onclick = () => leave();
      return;
    }
    if (s.phase === 'ready') {
      $app.innerHTML = shell(s, `<div class="body"><div style="opacity:.8;font-weight:600">Question ${s.qIndex + 1}</div><div class="big">${esc(s.question.text)}</div><div class="spinner"></div><div>Get ready…</div></div>`);
      return;
    }
    if (s.phase === 'question') {
      if (s.myAnswer) {
        $app.innerHTML = shell(s, `<div class="body"><div class="ptile opt-${s.myAnswer.choice}" style="width:120px;height:120px;min-height:0">${SHAPES[s.myAnswer.choice]}</div><div class="big">Answer locked in</div><div class="spinner"></div><div>Waiting for the others…</div></div>`);
        return;
      }
      const q = s.question;
      $app.innerHTML = shell(s, `<div style="padding:10px 14px 0;font-weight:600;text-align:center">${esc(q.text)}</div>
        <div class="ptiles ${q.options.length === 2 ? 'two' : ''}">${q.options.map((o, k) => `<button class="ptile opt-${k}" data-k="${k}">${SHAPES[k]}<span>${esc(o)}</span></button>`).join('')}</div>`);
      document.querySelectorAll('.ptile').forEach(b => b.onclick = async () => {
        if (sending) return; sending = true;
        if (navigator.vibrate) navigator.vibrate(30);
        document.querySelectorAll('.ptile').forEach(x => { if (x !== b) x.style.opacity = .3; });
        try { await api('/api/answer?pin=' + me.pin, { playerId: me.id, choice: +b.dataset.k }); }
        catch (e) { toast(e.message); }
        sending = false;
      });
      return;
    }
    if (s.phase === 'reveal' || s.phase === 'leaderboard') {
      const l = s.last || { answered: false, correct: false, points: 0 };
      const title = l.correct ? 'Correct!' : l.answered ? 'Not quite' : "Time's up!";
      const icon = l.correct ? '✅' : l.answered ? '❌' : '⏰';
      const right = s.question?.options?.[s.question.correct];
      $app.innerHTML = shell(s, `<div class="result ${l.correct ? 'ok' : 'no'}">
        <div style="font-size:64px">${icon}</div><div class="big">${title}</div>
        ${l.correct ? `<div class="badge">+${l.points}</div>${s.me.streak >= 2 ? `<div style="font-weight:600">🔥 Answer streak: ${s.me.streak}</div>` : ''}` :
          right ? `<div style="font-weight:600;opacity:.95">The answer was: ${esc(right)}</div>` : ''}
        <div style="margin-top:12px;font-size:18px">${standing(s)}</div></div>`, l.correct ? 'var(--good)' : 'var(--bad)');
      return;
    }
    if (s.phase === 'final') {
      const medal = ['🥇', '🥈', '🥉'][s.me.rank - 1] || '🎉';
      $app.innerHTML = shell(s, `<div class="body"><div style="font-size:72px">${medal}</div>
        <div class="big">You finished ${ord(s.me.rank)}</div><div style="opacity:.85">out of ${s.me.of} players · ${s.me.score} points</div>
        <div class="mini-pod">${(s.podium || []).map((p, i) => `<div><span>${['🥇', '🥈', '🥉'][i]} ${esc(p.name)}</span><span>${p.score}</span></div>`).join('')}</div>
        <button class="light" id="again" style="margin-top:10px">Play another game</button></div>`);
      document.getElementById('again').onclick = () => leave();
      return;
    }
  }
  return { init };
})();
</script>
<script>
'use strict';
// boot after both modules are defined
(location.pathname.replace(/\/$/, '') === '/host' ? Host : Player).init();
</script>
</body>
